.battlefield .row{justify-content:space-around}
small{color:#c9d7e9}
.log{background:#14243d;border-radius:8px;padding:12px;margin-top:10px;white-space:pre-line}
.badge{background:#355b82;border-radius:8px;padding:6px 10px}
</style>
